name: Build and deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Override config for GitHub Pages
        run: |
          cat > _config.override.yml << EOF
          baseurl: "/Decouverte-pmsc"
          url: "https://DamienDemontis.github.io"
          EOF
          cat _config.yml _config.override.yml > _config.final.yml
          mv _config.final.yml _config.yml

      - name: Build with Docker
        run: |
          docker build --target builder -t msc-epitech-builder:latest .
          docker create --name temp-container msc-epitech-builder:latest
          docker cp temp-container:/app/_site ./_site
          docker rm temp-container

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 