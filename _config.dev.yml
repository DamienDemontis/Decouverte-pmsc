# Development-specific configuration
# This file overrides settings in _config.yml when used with docker-compose

# Development URL settings
baseurl: ""
url: "http://localhost:4000"

# Development build settings
incremental: true
profile: true
strict_front_matter: true

# Show drafts and future posts in development
show_drafts: true
future: true
unpublished: true

# Livereload
livereload: true

# Verbose output for debugging
verbose: true

# Disable minification in development
sass:
  style: expanded
  sourcemap: development

# Plugin settings for development
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap