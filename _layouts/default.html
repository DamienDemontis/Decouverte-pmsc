<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  
  <!-- SEO -->
  {% seo %}
  
  <!-- Preconnect to external domains for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  
  <!-- Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  
  <!-- External Libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/swiper@10/swiper-bundle.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" integrity="sha512-c42qTSw/wPZ3/5LBzD+Bw5f7bSF2oxou6wEb+I/lqeaKV5FDIfMvvRp772y4jcJLKuGUOpbJMdg/BTl50fJYAw==" crossorigin="anonymous">
  
  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% if page.url == '/' %}
  <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
  {% endif %}
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ '/assets/images/Site_Decouverte_Icone.png' | relative_url }}">
</head>
<body>
  <!-- Menu latéral -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>MSc Epitech</h2>
      <p>Guide de découverte</p>
    </div>
    
    {% include navigation.html %}
  </nav>
  
  <!-- Bouton toggle menu mobile -->
  <button class="menu-toggle" id="menu-toggle">
    <i class="fas fa-bars"></i>
  </button>

  <!-- Contenu principal -->
  <div class="main-content">
    {{ content }}
    
    <footer class="site-footer">
      <div class="container">
        <div class="footer-content">
          <p>Site réalisé avec le 🫀 par <a href="https://demontis.dev" target="_blank" class="developer-link">Damien Demontis</a></p>
          <div class="social-links">
            <a href="https://www.linkedin.com/in/damien-demontis/" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
            <a href="https://github.com/DamienDemontis" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
            <a href="https://www.instagram.com/damien.demontis/" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <!-- Bouton retour en haut -->
  <div class="back-to-top" id="back-to-top">
    <i class="fas fa-arrow-up"></i>
  </div>

  <!-- Include Specialty Bot -->
  {% include specialty-bot.html %}

  <!-- Scripts -->
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  
  <!-- Swiper JS -->
  <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
</body>
</html>
