title: "Big Data & Analytics"
slug: "bigdata"
icon: "fas fa-database"
type: "tech"
order: 3
colors:
  primary: "#0EA5E9"
  secondary: "#38BDF8"
short_description: "Apprenez à collecter, stocker, traiter et analyser des volumes massifs de données pour en extraire des informations stratégiques et piloter la prise de décision."
description: "Découvrez comment maîtriser le déluge de données de notre ère digitale grâce aux technologies Big Data, aux architectures distribuées et aux techniques analytiques avancées qui révolutionnent la prise de décision."

overview:
  title: "Pourquoi le Big Data ?"
  features:
    - title: "Volume"
      icon: "fas fa-chart-line"
      description: "Des quantités massives de données qui dépassent les capacités de traitement traditionnelles."
      example: "Netflix ingère plus de 150 To de données par jour pour alimenter ses systèmes de recommandation."
    
    - title: "Vitesse"
      icon: "fas fa-bolt"
      description: "La création et le traitement de données à haute fréquence, souvent en temps réel."
      example: "Twitter traite plus de 500 millions de tweets quotidiens, soit près de 6000 tweets par seconde."
      
    - title: "Variété"
      icon: "fas fa-random"
      description: "Données structurées, semi-structurées et non structurées provenant de sources diverses."
      example: "TikTok analyse vidéos, audio, texte, comportement utilisateur et métadonnées simultanément."
      
    - title: "Véracité"
      icon: "fas fa-check-circle"
      description: "La fiabilité et la qualité des données, souvent compromise par leur volume même."
      example: "IBM estime que les mauvaises données coûtent 3,1 billions de dollars par an à l'économie américaine."
      
    - title: "Valeur"
      icon: "fas fa-gem"
      description: "Capacité à transformer les données en insights et en avantages concurrentiels."
      example: "Amazon génère 35% de ses ventes grâce à son système de recommandation basé sur le Big Data."
      
    - title: "Intelligence"
      icon: "fas fa-brain"
      description: "La capacité à extraire des connaissances et à prendre des décisions automatisées."
      example: "Les modèles prédictifs de Walmart prévoient les ventes avec une précision de 90% en intégrant 40 PB de données."

  accordion:
    - title: "Limitations des bases de données traditionnelles"
      content: |
        <p>Les SGBDR classiques (MySQL, PostgreSQL) rencontrent plusieurs obstacles face aux Big Data :</p>
        <ul>
          <li><strong>Scaling vertical limité</strong> : Impossible d'ajouter indéfiniment de la RAM ou des CPU</li>
          <li><strong>Jointures coûteuses</strong> : Deviennent prohibitives sur des milliards de lignes</li>
          <li><strong>Schéma rigide</strong> : Difficile d'adapter pour des données semi-structurées</li>
          <li><strong>Licensing onéreux</strong> : Les solutions Oracle/SQL Server deviennent très chères à grande échelle</li>
        </ul>
        <p>En revanche, les technologies Big Data sont conçues pour le <em>scaling horizontal</em> : ajouter des machines plutôt que de la puissance.</p>
    
    - title: "Limites du traitement séquentiel"
      content: |
        <p>Le traitement ligne par ligne devient problématique à l'échelle du Big Data :</p>
        <ul>
          <li><strong>Temps de calcul linéaire</strong> : Un traitement qui prend 1 minute sur 1 GB prendra théoriquement ~17 heures sur 1 TB</li>
          <li><strong>Goulots d'étranglement I/O</strong> : Les disques ne peuvent pas fournir les données assez rapidement</li>
          <li><strong>Limites de mémoire</strong> : Impossible de charger l'ensemble des données dans la RAM</li>
        </ul>
        <p>Les frameworks Big Data comme Spark ou Hadoop distribuent le traitement sur des dizaines ou centaines de nœuds en parallèle.</p>

  quote: "Nous ne sommes plus dans l'ère de l'information. Nous sommes dans l'ère de la gestion de l'information."
  quote_author: "Leandro Herrero"

use_cases:
  title: "Cas d'usage emblématiques"
  timeline:
