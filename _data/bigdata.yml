career_paths:
  title: "Perspectives de carrière"
  roles:
    - title: "Data Engineer"
      icon: "fas fa-cogs"
      mission: "Construire et maintenir l'infrastructure et les pipelines de données."
      skills: "SQL, Python, Spark, cloud, pipelines ETL/ELT, orchestration"
      salary: "45-75K€"
      country: "France"
    
    - title: "Big Data Architect"
      icon: "fas fa-sitemap"
      mission: "Concevoir des architectures data robustes, scalables et sécurisées."
      skills: "Architecture distribuée, data modeling, sécurité, gouvernance"
      salary: "60-90K€"
      country: "France"
    
    - title: "Data Analyst"
      icon: "fas fa-chart-line"
      mission: "Analyser les données pour en extraire des insights business et faciliter la prise de décision."
      skills: "SQL, Excel, BI (Tableau, Power BI), statistiques, data storytelling"
      salary: "40-65K€"
      country: "France"
    
    - title: "Data Scientist"
      icon: "fas fa-database"
      mission: "Créer des modèles prédictifs et extraire de la valeur des données via des algorithmes avancés."
      skills: "Python/R, statistiques, machine learning, data mining, modélisation"
      salary: "45-80K€"
      country: "France"

  evolution:
    title: "Évolution de carrière"
    timeline:
      - category: "Début de carrière"
        side: "left"
        items:
          - title: "Junior Data Engineer"
            description: "Construction de pipelines ETL et infrastructure data"
          - title: "BI Analyst"
            description: "Création de tableaux de bord et reporting pour le business"
          - title: "Data Analyst"
            description: "Analyse de données et production d'insights"
          - title: "Database Developer"
            description: "Développement et optimisation de bases de données"
      
      - category: "Mi-carrière"
        side: "right"
        items:
          - title: "Senior Data Engineer"
            description: "Conception d'architectures data complexes"
          - title: "Data Science Manager"
            description: "Supervision d'équipes d'analystes et scientifiques"
          - title: "Cloud Data Architect"
            description: "Conception de solutions data sur le cloud"
          - title: "Analytics Consultant"
            description: "Conseil en stratégie data pour organisations"
      
      - category: "Senior"
        side: "left"
        items:
          - title: "Chief Data Officer"
            description: "Direction de la stratégie data au niveau exécutif"
          - title: "VP of Analytics"
            description: "Supervision des initiatives analytiques globales"
          - title: "Data Governance Director"
            description: "Établissement des standards et politiques de données"
          - title: "Data Entrepreneur"
            description: "Création de startups innovantes basées sur les données"

  market_trends:
    title: "Tendances du marché"
    items:
      - "+43% de croissance des offres d'emploi en Big Data et Analytics depuis 2020"
      - "85% des entreprises déclarent avoir du mal à recruter des profils data qualifiés"
      - "Fortes demandes dans les secteurs de la santé, finance, retail et industrie 4.0"
      - "Convergence IA/Big Data créant de nouveaux rôles hybrides à forte valeur ajoutée"
      - "+30% de premium salarial pour les profils maîtrisant à la fois les technologies data et le cloud"

summary:
  title: "En résumé"
  description: "Le Big Data & Analytics représente un domaine fondamental dans l'économie numérique moderne, transformant la façon dont les organisations comprennent leurs activités et prennent des décisions. Cette spécialité combine :"
  points:
    - title: "Technologies de pointe"
      description: "Maîtrise des frameworks distribués et architectures scalables"
    - title: "Analyse stratégique"
      description: "Transformation des données en insights actionables pour le business"
    - title: "Impact mesurable"
      description: "Optimisation des performances et création de valeur tangible"
    - title: "Polyvalence"
      description: "Applications dans tous les secteurs économiques"
    - title: "Évolution rapide"
      description: "Intégration croissante avec l'IA et les technologies émergentes"
  conclusion: "Cette spécialité MSc te prépare à devenir un architecte de solutions data modernes, capable de naviguer dans l'écosystème complexe du Big Data tout en gardant une perspective business."

