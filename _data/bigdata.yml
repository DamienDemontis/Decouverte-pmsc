        - title: "Optimisation des prix"
          description: "Les compagnies aériennes ajustent leurs tarifs jusqu'à 100 000 fois par jour en fonction de la demande en temps réel."
        - title: "Analyse du parcours client"
          description: "Sephora combine données en ligne et en magasin pour créer une vue à 360° de ses 25 millions de clients."
          
    - category: "Santé et Recherche"
      side: "right"
      items:
        - title: "Médecine personnalisée"
          description: "Le projet \"All of Us\" du NIH américain analyse les données génomiques et médicales de plus d'un million de personnes pour révolutionner les traitements."
        - title: "Prédiction d'épidémies"
          description: "HealthMap a détecté l'épidémie d'Ebola 9 jours avant l'OMS en analysant les médias sociaux et les recherches web."
        - title: "Drug discovery"
          description: "Atomwise utilise l'IA sur des pétaoctets de données moléculaires pour simuler et tester virtuellement 10 millions de composés par jour."

  trends:
