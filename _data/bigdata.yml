projects:
  title: "Projets pratiques"
  items:
    - title: "Projet 1: TARDIS Bootstrap - Nettoyage et visualisation de données"
      difficulty: "Débutant"
      duration: "3-4 heures"
      objective: "Explorer, nettoyer et visualiser un jeu de données sur les retards de trains"
      description: |
        <p>Ce projet aboutit à l'acquisition des compétences essentielles en préparation et visualisation de données, fondamentales pour tout projet de data science. L'apprentissage porte sur:</p>
        <ul>
          <li>Charger et explorer un jeu de données à l'aide de pandas</li>
          <li>Identifier et résoudre les problèmes courants (valeurs manquantes, doublons, formats incohérents)</li>
          <li>Générer des visualisations pour comprendre les tendances</li>
          <li>Préparer les données pour l'analyse dans le projet principal</li>
        </ul>
        <p>Le projet utilise une approche étape par étape, avec des points de contrôle pour valider la compréhension, en s'appuyant sur des ressources externes et des tutoriels spécialisés.</p>
      technologies:
        - "Python avec les bibliothèques pandas, matplotlib et seaborn"
        - "Jupyter Notebook pour l'analyse interactive"
      resources:
        - text: "📋 Sujet complet (PDF)"
          url: "/assets/subjects/bigdata/tardis_bootstrap/G-AIA-210_tardis_bootstrap.pdf"
        - text: "🎯 Tutoriel complémentaire : Complete Data Cleaning with Pandas"
          url: "https://pandas.pydata.org/docs/getting_started/intro_tutorials/07_reshape_table_layout.html"
        - text: "Dataset projet"
          url: "/assets/subjects/bigdata/tardis_bootstrap/dataset.csv"
        - text: "Visualizations : Seaborn Tutorial"
          url: "https://seaborn.pydata.org/tutorial.html"

    - title: "Projet 2: TARDIS - Prédire l'imprévisible"
      difficulty: "Intermédiaire"
      duration: "10-15 heures"
      objective: "Analyser et prédire les retards de trains à l'aide de techniques de machine learning"
      description: |
        <p>Ce projet simule le rôle d'un analyste de données pour la SNCF. L'objectif est d'analyser les données historiques sur les retards des trains, de découvrir des modèles cachés et de développer un modèle prédictif qui peut prévoir les retards avant qu'ils ne se produisent.</p>
        <p>Le projet se décompose en 4 étapes principales :</p>
        <ol>
          <li><strong>Nettoyage et prétraitement des données</strong> - Gestion des valeurs manquantes, des incohérences et préparation du dataset pour l'analyse.</li>
          <li><strong>Analyse exploratoire (EDA)</strong> - Création de visualisations pertinentes pour comprendre les tendances et corrélations.</li>
          <li><strong>Modélisation prédictive</strong> - Implémentation d'un modèle de machine learning pour prédire les retards des trains.</li>
          <li><strong>Développement d'un dashboard</strong> - Création d'une application web interactive avec Streamlit pour présenter les résultats.</li>
        </ol>
        <p>Un sujet complet détaille chaque étape et les livrables attendus.</p>
      technologies:
        - "Python avec pandas, matplotlib, seaborn"
        - "Machine learning avec scikit-learn"
        - "Création d'interfaces utilisateur avec Streamlit"
        - "Développement d'un pipeline complet de data science"
      resources:
        - text: "📋 Sujet complet (PDF)"
          url: "/assets/subjects/bigdata/tardis_suite/G-AIA-210_tardis.pdf"
        - text: "🎯 Tutoriel complémentaire : Machine Learning Pipeline with Scikit-learn"
          url: "https://scikit-learn.org/stable/tutorial/statistical_inference/putting_together.html"
        - text: "Dataset projet"
          url: "/assets/subjects/bigdata/tardis_suite/dataset.csv"
        - text: "Dashboard Creation : Streamlit Tutorial"
          url: "https://docs.streamlit.io/library/get-started/create-an-app"

    - title: "Projet 3: Analyse de données massives"
      difficulty: "Débutant"
      duration: "4-6 heures"
      objective: "Explorer et analyser un jeu de données volumineux pour en extraire des insights"
      description: |
        <p>Dans ce projet, tu vas plonger dans un dataset volumineux du monde réel pour en extraire des tendances et patterns intéressants. Tu suivras une méthodologie structurée:</p>
        <ol>
          <li><strong>Préparation</strong>: Installer les bibliothèques nécessaires (pandas, matplotlib, seaborn) et charger le dataset</li>
          <li><strong>Exploration initiale</strong>: Comprendre la structure des données (types, valeurs manquantes, distributions)</li>
          <li><strong>Nettoyage</strong>: Traiter les valeurs manquantes et aberrantes, standardiser les formats</li>
          <li><strong>Analyse</strong>: Calculer des statistiques descriptives et identifier des relations entre variables</li>
          <li><strong>Visualisation</strong>: Créer au moins 3 types de graphiques différents pour illustrer tes découvertes</li>
          <li><strong>Insights</strong>: Formuler au moins 5 conclusions basées sur ton analyse</li>
        </ol>
        <p>Pour chaque étape, documenter ton raisonnement et justifier tes choix techniques dans un notebook Jupyter.</p>
      technologies:
        - "Python avec pandas, matplotlib, seaborn"
        - "Jupyter Notebook"
      resources:
        - text: "🎯 Tutoriel principal : Complete Data Analysis with Pandas"
          url: "https://pandas.pydata.org/docs/getting_started/intro_tutorials/index.html"
        - text: "Step-by-step : Data Visualization with Seaborn"
          url: "https://seaborn.pydata.org/tutorial.html"
        - text: "Jupyter Setup : Getting Started Guide"
          url: "https://jupyter-notebook.readthedocs.io/en/stable/examples/Notebook/Notebook_Basics.html"
        - text: "Real Datasets : Kaggle Learn Datasets"
          url: "https://www.kaggle.com/learn/data-cleaning"
      datasets:
        - text: "NYC Taxi Trips"
          url: "https://www.nyc.gov/site/tlc/about/tlc-trip-record-data.page"
        - text: "Instacart Market Basket"
          url: "https://www.kaggle.com/datasets/psparks/instacart-market-basket-analysis"
        - text: "Parcoursup"
          url: "https://data.enseignementsup-recherche.gouv.fr/explore/dataset/fr-esr-parcoursup/information/"

