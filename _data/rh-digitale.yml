            - text: "Welcome to the Jungle (pour s'inspirer des meilleures marques employeur)"
              url: "https://www.welcometothejungle.com/fr"

projects:
  title: "Projets pratiques"
  items:
    - title: "Projet 1: Créer un processus d'onboarding automatisé"
      difficulty: "Débutant"
      duration: "6-8 heures"
      objective: "Utiliser des outils simples pour améliorer l'expérience d'un nouvel arrivant."
      description: |
        <p>Imaginez l'arrivée d'un nouveau collaborateur. Utilisez des outils comme Trello ou Asana pour créer un "board" d'onboarding avec toutes les tâches à faire (RH, manager, IT). Utilisez un outil d'emailing comme Mailchimp pour programmer une série d'emails de bienvenue sur la première semaine.</p>
      technologies:
        - "Trello ou Asana pour la gestion de projet"
        - "Mailchimp pour l'automatisation d'emails"
        - "Google Forms pour les formulaires"
      resources:
        - text: "Guide onboarding - Trello"
          url: "https://blog.trello.com/employee-onboarding-process"
        - text: "Mailchimp Academy - Automation"
          url: "https://mailchimp.com/help/about-automation/"
        - text: "Google Forms - Créer des formulaires"
          url: "https://support.google.com/docs/answer/6281888"
    
    - title: "Projet 2: Construire un tableau de bord RH sur un jeu de données"
      difficulty: "Intermédiaire"
      duration: "8-12 heures"
      objective: "Se familiariser avec l'analyse et la visualisation de données RH."
      description: |
        <p>Trouvez un jeu de données RH public (sur Kaggle par exemple). Utilisez un tableur (Excel, Google Sheets) ou un outil de BI (Tableau Public, Power BI Desktop) pour créer un tableau de bord visuel avec des indicateurs clés : répartition par genre/âge, turnover par département, etc.</p>
      technologies:
        - "Excel ou Google Sheets"
        - "Tableau Public ou Power BI Desktop"
        - "Analyse de données RH"
      resources:
        - text: "Exemple de jeu de données RH sur Kaggle"
          url: "https://www.kaggle.com/datasets/rhuebner/human-resources-data-set"
    
    - title: "Projet 3: Évaluer et comparer 3 outils SIRH pour une PME"
      difficulty: "Intermédiaire"
      duration: "10 heures"
      objective: "Apprendre à analyser un besoin et à évaluer des solutions technologiques."
      description: |
        <p>Imaginez que vous êtes le DRH d'une PME de 100 personnes. Définissez ses besoins clés (gestion des congés, entretiens, notes de frais). Identifiez 3 acteurs du marché français (ex: Lucca, Payfit, Personio). Visitez leur site, demandez une démo si possible, et créez une grille de comparaison pour recommander la meilleure solution.</p>
      technologies:
        - "Analyse comparative SIRH"
        - "Évaluation de solutions"
        - "Rédaction de recommandations"
      resources:
        - text: "Guide d'évaluation SIRH"
          url: "https://www.lucca.fr/guide/choisir-sirh"
        - text: "Comparatif SIRH PME"
          url: "https://www.capterra.fr/directory/30079/hr/software"
        - text: "Grille d'évaluation logiciel"
          url: "https://blog.payfit.com/fr/comment-choisir-sirh/"

