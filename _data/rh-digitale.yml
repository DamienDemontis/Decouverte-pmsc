  skills:
    title: "Compétences recherchées"
    technical:
      title: "Compétences Techniques & Projets"
      items:
        - "Gestion de projet SIRH - Piloter le déploiement d'outils (cadrage, appel d'offres, conduite du changement)"
        - "HR Analytics - Maîtriser Excel et des outils de BI (Tableau, Power BI) pour créer des dashboards RH"
        - "Connaissance des outils - Comprendre l'écosystème des logiciels RH (paie, gestion des talents, etc.)"
        - "Marketing RH - Appliquer les techniques de marketing pour attirer les talents (marque employeur)"
        - "Droit social - Connaissance de base du droit du travail pour assurer la conformité des processus"
    
    specialized:
      title: "Compétences Stratégiques & Transformation"
      items:
        - "Vision People Analytics - Transformer la fonction RH d'administrative à stratégique grâce aux données"
        - "Employee Experience Design - Concevoir des parcours collaborateur fluides et engageants"
        - "Culture & Transformation - Accompagner l'évolution de la culture d'entreprise vers l'agilité et l'innovation"
        - "Prospective RH - Anticiper les évolutions du travail (télétravail, compétences futures, nouveaux métiers)"
        - "Écosystème HR Tech - Connaître les startups et solutions innovantes du secteur"
    
    soft_skills:
      title: "Soft skills et autres compétences"
      items:
        - "Communication - Dialoguer avec la DSI, les directions métiers et les collaborateurs"
        - "Gestion du changement - Accompagner les équipes dans l'adoption de nouveaux outils et processus"
        - "Empathie - Concevoir des processus et des outils centrés sur l'expérience du collaborateur"
        - "Analyse et synthèse - Transformer les données RH en recommandations stratégiques"
        - "Curiosité - Assurer une veille permanente sur les innovations et les nouvelles pratiques RH"

  market_trends:
    title: "Tendances du marché"
    items:
      - "Expérience collaborateur symétrique : Offrir aux employés une expérience digitale aussi fluide que celle des clients"
      - "IA pour l'automatisation : L'IA générative est de plus en plus utilisée pour rédiger des offres d'emploi, analyser des CV ou répondre aux questions des salariés"
      - "Le 'skills-based organization' : Les entreprises se tournent vers des outils qui permettent de gérer les compétences plutôt que les postes"
      - "People Analytics : La prise de décision basée sur les données RH devient un standard pour piloter la stratégie humaine"
      - "Plateformes de 'Talent Marketplace' : Des outils qui favorisent la mobilité interne en rendant visibles toutes les opportunités (postes, projets) au sein de l'entreprise"

summary:
  title: "En résumé"
  description: "La Digitalisation de la fonction RH (HR Tech) révolutionne la gestion du capital humain en plaçant l'expérience collaborateur et la donnée au cœur des processus. Cette spécialité combine :"
  points:
    - title: "Transformation digitale"
      description: "Modernisation des processus RH grâce aux outils SIRH et à l'automatisation"
    - title: "Analyse de données"
      description: "Utilisation de la HR Analytics pour des décisions stratégiques basées sur la donnée"
    - title: "Expérience collaborateur"
      description: "Conception de parcours employé fluides et engageants"
    - title: "Gestion du changement"
      description: "Accompagnement des équipes dans l'adoption de nouvelles pratiques"
    - title: "Innovation RH"
      description: "Intégration des dernières technologies (IA, analytics) pour optimiser la gestion des talents"
  conclusion: "Cette spécialité MSc te prépare à devenir un acteur clé de la transformation RH, capable de concevoir et déployer des solutions innovantes qui améliorent l'efficacité des processus tout en enrichissant l'expérience des collaborateurs."

