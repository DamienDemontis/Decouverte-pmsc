career_paths:
  title: "Perspectives de carrière"
  description: "Cette spécialité forme des profils \"hybrides\", capables de faire le pont entre la technologie et le business, qui sont très recherchés."
  
  roles:
    - title: "Chef de Projet IA / Transformation Digitale"
      icon: "fas fa-project-diagram"
      mission: "Piloter des projets de transformation basés sur l'IA, de l'identification du besoin au déploiement, en coordonnant les équipes techniques et métiers."
      skills: "Gestion de projet, compréhension des enjeux IA, communication, conduite du changement"
      salary: "42-55K€"
      country: "France"
    
    - title: "Consultant en Transformation par l'IA"
      icon: "fas fa-handshake"
      mission: "Accompagner les entreprises dans leur stratégie IA, l'identification de cas d'usage, et le pilotage de leurs programmes de transformation."
      skills: "Analyse stratégique, résolution de problèmes, communication, connaissance sectorielle"
      salary: "45-60K€"
      country: "France"
    
    - title: "Product Manager IA"
      icon: "fas fa-lightbulb"
      mission: "Définir la vision et la feuille de route pour des produits intégrant des fonctionnalités d'IA, en se concentrant sur la valeur pour l'utilisateur."
      skills: "Stratégie produit, UX, analyse de données, compréhension des spécificités des produits IA"
      salary: "45-60K€"
      country: "France"
    
    - title: "Change Manager"
      icon: "fas fa-users"
      mission: "Se spécialiser dans l'accompagnement humain des transformations technologiques, en assurant la formation, la communication et l'adoption des nouveaux outils."
      skills: "Pédagogie, communication, psychologie organisationnelle, gestion de projet"
      salary: "40-50K€"
      country: "France"
    
    - title: "Business Analyst / AI Translator"
      icon: "fas fa-sitemap"
      mission: "Faire le lien entre les experts métiers et les équipes data/IA. Traduire un besoin business en spécifications techniques pour un projet IA."
      skills: "Analyse fonctionnelle, communication, capacité à vulgariser, connaissance des deux mondes"
      salary: "40-50K€"
