title: "Data, Protection & Sécurité"
slug: "data-protection"
icon: "fas fa-shield-alt"
type: "business"
order: 5
colors:
  primary: "#4F46E5"
  secondary: "#A5B4FC"
short_description: "Devenez un expert de la confiance numérique en maîtrisant la protection des données, la gestion des risques et la conformité réglementaire."
description: "Développez une expertise à l'intersection de la gestion des données, de la cybersécurité et du droit pour concevoir et mettre en œuvre des stratégies de protection des données qui renforcent la confiance et garantissent la conformité des organisations."

overview:
  title: "Pourquoi la Data, Protection & Sécurité ?"
  features:
    - title: "Un enjeu de conformité majeur"
      icon: "fas fa-gavel"
      description: "Avec le RGPD, la directive NIS2 et d'autres régulations, la conformité n'est plus une option. C'est une obligation légale et un gage de sérieux."
    
    - title: "Le pilier de la confiance numérique"
      icon: "fas fa-handshake"
      description: "Les clients et utilisateurs ne confient leurs données qu'aux organisations qu'ils estiment dignes de confiance. La protection des données est un différenciant clé."
    
    - title: "Gestion des risques cyber"
      icon: "fas fa-shield-check"
      description: "Apprenez à identifier, évaluer et gérer les risques pour protéger les données sensibles de votre organisation contre des menaces en constante évolution."
    
    - title: "Au cœur de la stratégie d'entreprise"
      icon: "fas fa-sitemap"
      description: "La gouvernance des données n'est pas qu'un sujet technique ou juridique, c'est un sujet de direction générale qui impacte tous les départements."
    
    - title: "Un rôle de communicant et de pédagogue"
      icon: "fas fa-comments"
      description: "Sensibilisez les collaborateurs, expliquez les politiques de sécurité et communiquez efficacement avec toutes les parties prenantes, internes comme externes."
    
    - title: "L'analyse de données pour la sécurité"
      icon: "fas fa-search-plus"
      description: "Utilisez les techniques d'analyse de données pour détecter des menaces potentielles, des vulnérabilités et des comportements anormaux."

  accordion:
    - title: "Le Cadre Légal et Réglementaire"
      content: |
        <p>La protection des données s'inscrit dans un cadre juridique précis qu'il est essentiel de maîtriser.</p>
        <ul>
          <li><strong>RGPD (Règlement Général sur la Protection des Données)</strong> : Le texte de référence en Europe qui définit les droits des personnes et les obligations des organisations.</li>
          <li><strong>Privacy by Design & by Default</strong> : Intégrer la protection des données dès la conception d'un projet et appliquer les paramètres les plus protecteurs par défaut.</li>
          <li><strong>Analyse d'Impact sur la Vie Privée (AIPD)</strong> : Une étude obligatoire pour les traitements de données présentant un risque élevé.</li>
        </ul>
    
    - title: "La Gouvernance et la Gestion des Risques"
      content: |
        <p>Mettre en place les politiques, les processus et les contrôles pour assurer une protection efficace.</p>
        <ul>
          <li><strong>Politique de Sécurité des Systèmes d'Information (PSSI)</strong> : Le document cadre qui définit la stratégie de sécurité de l'organisation.</li>
          <li><strong>Analyse de risques</strong> : Méthodologies (ex: EBIOS Risk Manager) pour identifier les menaces, les vulnérabilités et évaluer les risques.</li>
          <li><strong>Plan de Continuité d'Activité (PCA)</strong> : Préparer l'organisation à réagir en cas d'incident de sécurité majeur (ex: cyberattaque).</li>
        </ul>
    
    - title: "Les Technologies de Sécurité"
      content: |
        <p>Comprendre les technologies clés qui permettent de protéger les données et les systèmes.</p>
        <ul>
          <li><strong>Cryptographie</strong> : Chiffrer les données au repos et en transit pour garantir leur confidentialité.</li>
          <li><strong>Gestion des identités et des accès (IAM)</strong> : S'assurer que seules les bonnes personnes ont accès aux bonnes informations.</li>
          <li><strong>Sécurité des réseaux</strong> : Firewalls, détection d'intrusion (IDS/IPS), VPN... pour protéger le périmètre de l'organisation.</li>
        </ul>

  quote: "La confiance est difficile à gagner, facile à perdre, et encore plus difficile à regagner. La protection des données est le fondement de cette confiance à l'ère numérique."
  quote_author: ""

use_cases:
  title: "Cas d'usage emblématiques"
  timeline:
    - category: "Gestion de crise"
      side: "left"
      items:
        - title: "Gestion d'une violation de données"
          description: "Une entreprise de e-commerce découvre qu'une base de données clients a été exfiltrée. L'expert active la cellule de crise, qualifie l'incident, notifie la CNIL sous 72h, prépare la communication clients et coordonne l'analyse technique. Une gestion transparente et efficace permet de limiter l'impact sur la réputation."
    
    - category: "Mise en conformité"
      side: "right"
      items:
        - title: "Mise en conformité d'une nouvelle application"
          description: "Une startup développe une app mobile de santé collectant des données sur l'activité physique. L'expert intervient dès le début (Privacy by Design), mène une AIPD, conseille sur la minimisation des données et vérifie l'hébergement certifié. L'application est lancée en conformité RGPD."
    
    - category: "Sensibilisation"
      side: "left"
      items:
        - title: "Programme de sensibilisation des collaborateurs"
          description: "Une PME constate une augmentation des tentatives de phishing réussies. L'expert conçoit un programme de sensibilisation avec e-learning, campagnes de phishing simulées et communication régulière. Le taux de clics sur les emails malveillants diminue de 80%."

roadmap:
  title: "Parcours d'apprentissage"
  phases:
    - title: "🎯 Phase 1: Les Fondamentaux (1-3 mois)"
      duration: "1-3 mois"
      steps:
        - title: "Droit de la protection des données"
          description: "Maîtriser le RGPD et ses grands principes (finalité, minimisation, licéité, etc.)."
          resources:
            - text: "Le texte intégral du RGPD (CNIL)"
              url: "https://www.cnil.fr/fr/reglement-europeen-protection-donnees"
            - text: "Les principes clés de la protection des données (CNIL)"
              url: "https://www.cnil.fr/fr/les-6-principes-cles-du-rgpd"
        
        - title: "Principes de la Cybersécurité"
          description: "Comprendre les concepts de base de la sécurité des systèmes d'information (Confidentialité, Intégrité, Disponibilité)."
          resources:
            - text: "Guide d'hygiène informatique de l'ANSSI"
              url: "https://www.ssi.gouv.fr/guide/guide-dhygiene-informatique/"
    
    - title: "🚀 Phase 2: Le cœur du métier (3-6 mois)"
      duration: "3-6 mois"
      steps:
        - title: "Gestion des risques et conformité"
          description: "Apprendre les méthodologies d'analyse de risques et les cadres de gouvernance (frameworks)."
          resources:
            - text: "Norme ISO/IEC 27001"
              url: "https://www.iso.org/fr/standard/75281.html"
            - text: "Méthode EBIOS Risk Manager (ANSSI)"
              url: "https://www.ssi.gouv.fr/uploads/2019/11/anssi-guide-ebios_risk_manager-en-v1.0.pdf"
        
        - title: "Technologies de sécurité"
          description: "Approfondir les connaissances sur les outils de sécurité : cryptographie, gestion des accès, sécurité des réseaux."
          resources: []

projects:
  title: "Projets pratiques"
  items:
    - title: "Projet 1: Réaliser l'audit RGPD d'un site web"
      difficulty: "Débutant"
      duration: "6-8 heures"
      objective: "Appliquer concrètement les principes du RGPD."
      description: |
        <p>Choisissez le site web d'une association ou d'une petite entreprise. Analysez sa politique de confidentialité, son bandeau cookie, et ses formulaires de contact.</p>
        <p>Rédigez un mini-rapport d'audit identifiant 3 à 5 points de non-conformité et les actions correctives à apporter. Ce projet vous permettra de comprendre concrètement l'application du RGPD.</p>
      technologies:
        - "Outils d'audit en ligne (ex: Website Policy Generator)"
        - "Grille d'audit RGPD"
        - "Documentation juridique CNIL"
      resources: []
    
    - title: "Projet 2: Mener une analyse de risques sur un cas simple"
      difficulty: "Intermédiaire"
      duration: "10-12 heures"
      objective: "Se familiariser avec la méthodologie d'analyse de risques."
      description: |
        <p>Prenez le cas d'une association qui gère les données de ses membres sur un simple fichier Excel stocké sur un ordinateur portable.</p>
        <p>En utilisant une version simplifiée d'EBIOS, identifiez les biens essentiels (le fichier), les scénarios de menace (vol de l'ordinateur, phishing), les risques et proposez des mesures de sécurité (chiffrement du disque, sauvegarde, etc.).</p>
      technologies:
        - "Méthodologie EBIOS Risk Manager"
        - "Matrice de risques"
        - "Outils de cartographie (ex: Lucidchart)"
      resources: []
    
    - title: "Projet 3: Rédiger une charte informatique"
      difficulty: "Intermédiaire"
      duration: "8 heures"
      objective: "Formaliser les bonnes pratiques de sécurité pour des utilisateurs."
      description: |
        <p>Imaginez que vous êtes le responsable de la sécurité d'une PME. Rédigez une charte informatique d'une ou deux pages destinée à tous les collaborateurs.</p>
        <p>Elle doit expliquer de manière simple et claire les règles d'utilisation des outils informatiques, la politique de mot de passe, la conduite à tenir en cas d'email suspect, etc.</p>
      technologies:
        - "Templates de charte informatique"
        - "Outils de rédaction collaborative"
        - "Référentiels de bonnes pratiques ANSSI"
      resources: []

