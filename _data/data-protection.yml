careers: true
career_paths:
  title: "Perspectives de carrière"
  description: "Un secteur en tension avec des débouchés dans tous les types d'organisations, des entreprises privées aux administrations publiques."
  
  roles:
    - title: "Délégué à la Protection des Données (DPO)"
      icon: "fas fa-user-secret"
      mission: "Le \"chef d'orchestre\" de la conformité RGPD. Il informe, conseille, contrôle et coopère avec l'autorité de contrôle (CNIL)."
      skills: "Droit, gestion de projet, communication, connaissance technique"
      salary: "45-70K€"
      country: "France"
    
    - title: "Consultant RGPD / Protection des données"
      icon: "fas fa-handshake"
      mission: "Accompagner plusieurs entreprises dans leur mise en conformité, réaliser des audits, des analyses d'impact et jouer le rôle de DPO externe."
      skills: "Gestion de projet, adaptabilité, communication, expertise juridique et technique"
      salary: "40-65K€"
      country: "France"
    
    - title: "Chef de projet cybersécurité"
      icon: "fas fa-tasks"
      mission: "Piloter des projets visant à renforcer la sécurité (ex: déploiement d'un nouvel outil, campagne de sensibilisation) en respectant le budget et les délais."
      skills: "Gestion de projet, connaissance des solutions de sécurité, organisation"
      salary: "42-60K€"
      country: "France"
    
    - title: "Spécialiste en gestion de crise cyber"
      icon: "fas fa-fire-extinguisher"
      mission: "Préparer l'entreprise à faire face à une cyberattaque et piloter la réponse en cas d'incident pour en limiter l'impact."
      skills: "Gestion de crise, sang-froid, communication, connaissance technique"
      salary: "50-75K€"
      country: "France"
    
    - title: "Formateur cybersécurité"
      icon: "fas fa-chalkboard-teacher"
      mission: "Concevoir et animer des formations pour sensibiliser les collaborateurs aux risques et leur apprendre les bons réflexes de sécurité."
      skills: "Pédagogie, communication, expertise technique"
      salary: "38-55K€"
      country: "France"

  evolution:
    title: "Évolution de carrière"
    timeline:
      - category: "Début de carrière"
        side: "left"
        items:
          - title: "Consultant junior (RGPD/Cyber)"
            description: "Accompagnement de projets de conformité et de sécurité"
          - title: "Chargé de conformité"
            description: "Gestion de la conformité réglementaire au sein d'une organisation"
          - title: "Analyste en gouvernance des données"
            description: "Analyse et mise en place de politiques de gouvernance"
      
      - category: "Mi-carrière"
        side: "right"
        items:
