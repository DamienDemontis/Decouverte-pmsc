            description: "Pilotage de projets complexes et encadrement d'équipes"
          - title: "Chef de projet sécurité"
            description: "Direction de projets de sécurisation des systèmes"
          - title: "Délégué à la Protection des Données (DPO)"
            description: "Responsabilité complète de la conformité RGPD"
      
      - category: "Senior"
        side: "left"
        items:
          - title: "Responsable de la Protection des Données (groupe)"
            description: "Coordination de la conformité au niveau groupe"
          - title: "RSSI - orientation gouvernance"
            description: "Direction de la sécurité avec focus gouvernance"
          - title: "Partner en cabinet de conseil"
            description: "Développement commercial et expertise sectorielle"

  skills:
    title: "Compétences recherchées"
    juridical:
      title: "Compétences Juridiques & Conformité"
      items:
        - "Maîtrise du RGPD - Connaissance approfondie du règlement et de son application"
        - "Droit du numérique - Connaissance des lois connexes (ePrivacy, NIS2, Data Act, AI Act...)"
        - "Analyses d'Impact (AIPD) - Capacité à mener des analyses de risques sur la vie privée"
        - "Veille réglementaire - Suivi constant de l'évolution des législations nationales et européennes"
    
    security:
      title: "Compétences en Sécurité & Gouvernance"
      items:
        - "Gestion des risques - Maîtrise des méthodologies d'analyse de risques (EBIOS, ISO 27005)"
        - "Gouvernance de la sécurité - Connaissance des standards comme ISO 27001/27002, le framework NIST"
        - "Gestion de crise - Capacité à élaborer et dérouler un plan de réponse à incident"
        - "Sécurité technique - Compréhension des concepts de cryptographie, gestion des accès, sécurité des réseaux"
    
    soft_skills:
