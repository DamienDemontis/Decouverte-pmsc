            - text: "Google Skillshop"
              url: "https://skillshop.withgoogle.com/"

projects:
  title: "Projets pratiques"
  items:
    - title: "Projet 1: Lancer un blog ou une chaîne sur une niche"
      difficulty: "Débutant"
      duration: "10-15 heures (lancement) + 2h/semaine"
      objective: "Appliquer les bases du SEO, du content marketing et du community management."
      description: |
        <p>Choisissez une passion (le café, les jeux de société, le jardinage...) et créez un blog (avec Wordpress, Ghost) ou une chaîne TikTok/Instagram/YouTube. L'objectif est de produire 5 à 10 contenus et de commencer à créer une petite audience.</p>
        <p>Étapes :</p>
        <ol>
          <li>Définir sa niche et son audience cible.</li>
          <li>Créer ses comptes/son site.</li>
          <li>Faire une recherche de mots-clés/sujets pertinents.</li>
          <li>Produire et publier les premiers contenus.</li>
          <li>Promouvoir ses contenus sur d'autres plateformes.</li>
        </ol>
      technologies:
        - "WordPress, Ghost ou plateformes de blog"
        - "Canva pour les visuels"
        - "Outils SEO basiques"
        - "Réseaux sociaux (Instagram, TikTok, YouTube)"
      resources:
        - text: "WordPress.com - Créer un blog"
          url: "https://wordpress.com/create-blog/"
        - text: "Guide SEO pour débutants - Moz"
          url: "https://moz.com/beginners-guide-to-seo"
        - text: "Canva - Créer des visuels de blog"
          url: "https://www.canva.com/templates?q=blog+graphics"
    
    - title: "Projet 2: Gérer un budget publicitaire de 50€ sur Meta"
      difficulty: "Débutant"
      duration: "4-6 heures"
      objective: "Se familiariser avec le gestionnaire de publicités de Meta et comprendre les indicateurs clés."
      description: |
        <p>Pour votre projet de blog/chaîne ou pour une cause/un événement local, créez une campagne publicitaire sur Facebook/Instagram avec un petit budget. L'objectif n'est pas la performance, mais de comprendre le processus.</p>
        <p>Étapes :</p>
        <ol>
          <li>Créer une page Facebook et un compte Instagram si besoin.</li>
          <li>Configurer le Gestionnaire de Publicités Meta.</li>
          <li>Définir une audience, un objectif (ex: trafic, engagement) et un budget.</li>
          <li>Créer un visuel et un texte publicitaire simples.</li>
          <li>Lancer la campagne et suivre les résultats (portée, clics, coût par clic).</li>
        </ol>
      technologies:
        - "Meta Business Manager"
        - "Facebook Ads Manager"
        - "Canva pour les créations"
        - "Google Analytics pour le suivi"
      resources:
        - text: "Guide Facebook Ads - Meta Business"
          url: "https://www.facebook.com/business/help/200000840044554"
        - text: "Créer sa première campagne Facebook"
          url: "https://www.facebook.com/business/learn/"
        - text: "Analytics Academy - Google"
          url: "https://analytics.google.com/analytics/academy/"
    
    - title: "Projet 3: Contacter 10 micro-influenceurs pour un partenariat (même fictif)"
      difficulty: "Intermédiaire"
      duration: "8-10 heures"
      objective: "Apprendre à identifier, contacter et proposer une collaboration à des créateurs."
      description: |
        <p>Pour votre projet de niche, identifiez 10 micro-influenceurs (1k-10k abonnés) pertinents. Rédigez un message de contact personnalisé pour leur proposer une collaboration (ex: leur envoyer un produit fictif en échange d'un post).</p>
        <p>Étapes :</p>
        <ol>
          <li>Définir le profil de l'influenceur idéal.</li>
          <li>Utiliser la recherche Instagram/TikTok avec des hashtags pour les trouver.</li>
          <li>Analyser leur contenu et l'engagement de leur communauté.</li>
          <li>Rédiger une proposition de valeur claire et personnalisée pour chaque influenceur.</li>
          <li>Envoyer les messages et suivre les réponses.</li>
        </ol>
      technologies:
        - "Outils de recherche d'influenceurs"
        - "Instagram, TikTok, YouTube"
        - "Tableur pour le suivi"
        - "Templates de messages"
      resources:
        - text: "Guide complet du marketing d'influence"
          url: "https://blog.hubspot.com/marketing/influencer-marketing-power"
        - text: "Template outreach influenceur"
          url: "https://grin.co/influencer-outreach-email-templates/"
        - text: "Recherche d'influenceurs sur Instagram"
          url: "https://blog.hootsuite.com/how-to-find-instagram-influencers/"

