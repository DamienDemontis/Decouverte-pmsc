          - title: "Chief Marketing Officer (CMO)"
            description: "Direction exécutive du marketing"

  skills:
    title: "Compétences recherchées"
    technical:
      title: "Compétences Techniques & Analytiques"
      items:
        - "SEO/SEA - Maîtrise des outils (SEMrush, Ahrefs) et des plateformes (Google Ads, Meta Ads)"
        - "Analyse de Données - Utilisation de Google Analytics, d'outils de BI (Tableau, Looker) pour suivre les KPIs et le ROI"
        - "Marketing Automation - Connaissance des plateformes comme HubSpot ou Mailchimp pour créer des scénarios"
        - "Gestion de Contenu - Maîtrise des CMS (Wordpress, etc.) et des outils de création (Canva, Figma, suite Adobe)"
        - "Social Media Management - Utilisation des plateformes de gestion (Hootsuite, Buffer) et des outils d'analyse natifs"
    
    specialized:
      title: "Compétences Stratégiques & Créatives"
      items:
        - "Storytelling - Capacité à créer des récits de marque engageants et authentiques"
        - "Vision Stratégique - Définir une stratégie de contenu et d'influence alignée sur les objectifs business"
        - "Créativité - Concevoir des campagnes originales et des formats de contenu innovants"
        - "Gestion de Communauté - Savoir engager, modérer et faire grandir une communauté en ligne"
        - "Relationnel & Négociation - Construire des relations solides avec les influenceurs et négocier des partenariats"
    
    soft_skills:
      title: "Soft skills et compétences comportementales"
      items:
        - "Empathie et écoute - Comprendre profondément les besoins et aspirations de sa cible"
        - "Adaptabilité - Suivre les tendances rapidement évolutives des plateformes et des algorithmes"
        - "Résilience - Gérer les critiques et les échecs dans un domaine très exposé publiquement"
        - "Curiosité permanente - Veille constante sur les nouveaux formats, influenceurs et plateformes émergentes"
        - "Collaboration - Travailler efficacement avec des équipes créatives, techniques et commerciales"

  market_trends:
    title: "Tendances du marché"
    items:
      - "Économie des Créateurs : Les marques investissent de plus en plus dans des partenariats à long terme et la co-création avec les influenceurs"
      - "Domination de la Vidéo Courte : TikTok et Instagram Reels sont des canaux incontournables pour la visibilité et l'engagement"
      - "IA Générative : L'IA est utilisée pour la création de contenu, la personnalisation des campagnes et l'analyse prédictive des tendances"
      - "Commerce Social : L'intégration de fonctionnalités d'achat directement dans les plateformes sociales devient la norme"
      - "Authenticité et Niche : Le public se tourne vers des micro et nano-influenceurs pour des recommandations perçues comme plus authentiques"

