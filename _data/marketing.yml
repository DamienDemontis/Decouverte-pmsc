              url: "https://later.com/blog/"
        
        - title: "Publicité en Ligne (Paid Ads)"
          description: "Apprendre à créer, gérer et optimiser des campagnes publicitaires sur les plateformes comme Meta (Facebook/Instagram) et Google."
