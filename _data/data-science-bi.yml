title: "Data Science & Business Intelligence"
slug: "data-science-bi"
icon: "fas fa-chart-bar"
type: "business"
order: 8
colors:
  primary: "#0284C7"
  secondary: "#38BDF8"
short_description: "Exploitez le potentiel des données pour générer des insights stratégiques, prendre des décisions éclairées et créer un avantage concurrentiel durable."
description: "Maîtrisez les techniques d'analyse de données avancées et les outils de business intelligence pour transformer les données brutes en connaissances actionnables qui guident la stratégie d'entreprise et optimisent les performances."

overview:
  title: "Pourquoi la Data Science & Business Intelligence ?"
  features:
    - title: "Le nouvel or noir"
      icon: "fas fa-database"
      description: "Les données sont l'actif le plus précieux du 21e siècle. Apprenez à les extraire, les raffiner et les transformer en décisions stratégiques."
    
    - title: "Du descriptif au prédictif"
      icon: "fas fa-magic"
      description: "Allez au-delà du \"que s'est-il passé ?\" (BI) pour répondre à \"que va-t-il se passer ?\" (Data Science) et prescrire les meilleures actions."
    
    - title: "Prise de décision éclairée"
      icon: "fas fa-bullseye"
      description: "Remplacez l'intuition par des faits. Fournissez aux décideurs des visualisations claires et des analyses robustes pour guider la stratégie de l'entreprise."
    
    - title: "Optimisation des performances"
      icon: "fas fa-cogs"
      description: "Identifiez les inefficacités, optimisez les processus marketing, les opérations logistiques ou la tarification grâce à une analyse fine des données."
    
    - title: "Compréhension client 360°"
      icon: "fas fa-user-friends"
      description: "Analysez les comportements, segmentez les audiences et personnalisez l'expérience client pour augmenter la satisfaction et la fidélité."
    
    - title: "Un avantage concurrentiel"
      icon: "fas fa-search-dollar"
      description: "Les entreprises \"data-driven\" (pilotées par la donnée) sont plus agiles, plus innovantes et surpassent systématiquement leurs concurrents."

  accordion:
    - title: "Business Intelligence (BI)"
      content: |
        <p>La BI se concentre sur l'analyse descriptive pour comprendre le passé et le présent. C'est le reporting et la visualisation des données de l'entreprise.</p>
        <ul>
          <li><strong>ETL (Extract, Transform, Load)</strong> : Processus pour collecter les données de multiples sources, les nettoyer et les charger dans un entrepôt de données (Data Warehouse).</li>
          <li><strong>Data Visualisation</strong> : Création de tableaux de bord (dashboards) et de rapports interactifs avec des outils comme Tableau, Power BI ou Looker.</li>
          <li><strong>Indicateurs clés de performance (KPIs)</strong> : Définition et suivi des métriques qui comptent pour l'entreprise.</li>
        </ul>
    
    - title: "Data Science"
      content: |
        <p>La Data Science utilise des méthodes statistiques et le Machine Learning pour faire des prédictions sur l'avenir et découvrir des insights cachés.</p>
        <ul>
          <li><strong>Exploratory Data Analysis (EDA)</strong> : Exploration approfondie des données pour formuler des hypothèses.</li>
          <li><strong>Machine Learning</strong> : Entraînement de modèles (régression, classification, clustering) pour prédire des résultats ou segmenter des données.</li>
          <li><strong>Déploiement</strong> : Mettre un modèle en production pour qu'il puisse faire des prédictions en continu.</li>
        </ul>
    
    - title: "Data Engineering"
      content: |
        <p>C'est la fondation qui rend la BI et la Data Science possibles. Le Data Engineering construit et maintient les pipelines et les architectures de données.</p>
        <ul>
          <li><strong>Data Pipelines</strong> : Création de flux de données robustes et automatisés.</li>
          <li><strong>Data Warehousing & Data Lakes</strong> : Conception des systèmes de stockage pour les données structurées (Warehouse) et non structurées (Lake).</li>
          <li><strong>Qualité et Gouvernance</strong> : Assurer que la donnée est fiable, sécurisée et accessible.</li>
        </ul>

  quote: "Sans données, vous n'êtes qu'une personne de plus avec une opinion."
  quote_author: "W. Edwards Deming, statisticien et consultant en management"

use_cases:
  title: "Cas d'usage emblématiques"
  timeline:
    - category: "Streaming & Divertissement"
      side: "left"
      items:
        - title: "Netflix : La recommandation de contenu"
          description: "Des algorithmes de machine learning analysent l'historique de visionnage de millions d'utilisateurs pour prédire les films et séries qu'un utilisateur spécifique est susceptible d'aimer. Même les vignettes des films sont personnalisées. Netflix estime que son système lui fait économiser plus d'un milliard de dollars par an en réduisant le désabonnement."
    
    - category: "E-commerce & Logistique"
      side: "right"
      items:
        - title: "Amazon : L'optimisation de la chaîne logistique"
          description: "Des modèles prédictifs anticipent les achats des clients au niveau local pour pré-positionner les stocks dans les entrepôts les plus proches. L'optimisation des tournées des livreurs résout un problème complexe avec des algorithmes. Résultat : des délais de livraison record qui sont devenus un avantage concurrentiel majeur."
    
    - category: "Musique & Découverte"
      side: "left"
      items:
        - title: "Spotify : La découverte musicale"
          description: "Des algorithmes (notamment le filtrage collaboratif) analysent les goûts des utilisateurs et les comparent à ceux d'autres profils similaires pour créer des playlists personnalisées comme le \"Discover Weekly\". Une expérience utilisateur hyper-personnalisée qui a fait de Spotify le leader du streaming musical."

  trends:
    title: "Tendances émergentes"
    features:
      - title: "Augmented Analytics"
        icon: "fas fa-brain"
        description: "L'IA est intégrée directement dans les outils de BI pour suggérer des analyses, détecter des anomalies et expliquer les insights en langage naturel."
      
      - title: "Data Mesh"
        icon: "fas fa-sitemap"
        description: "Une nouvelle approche décentralisée de l'architecture de données, où chaque domaine métier gère ses propres données comme un produit."
      
      - title: "Modern Data Stack"
        icon: "fas fa-feather-alt"
        description: "L'émergence d'outils cloud-natifs et interopérables (comme Snowflake, dbt, Fivetran) pour construire des plateformes de données plus rapidement et plus souplement."
      
      - title: "MLOps (Machine Learning Operations)"
        icon: "fas fa-shield-alt"
        description: "Des pratiques inspirées du DevOps pour industrialiser, superviser et maintenir les modèles de machine learning en production."

roadmap:
  title: "Parcours d'apprentissage"
  phases:
    - title: "🎯 Phase 1: Les Fondamentaux (1-3 mois)"
      duration: "1-3 mois"
      steps:
        - title: "Mathématiques et Statistiques"
          description: "Rafraîchir les bases en statistiques descriptives, probabilités et algèbre linéaire. C'est le langage de la data."
          resources:
            - text: "Statistiques et probabilités (Khan Academy)"
              url: "https://www.khanacademy.org/math/statistics-probability"
        
        - title: "Programmation avec Python"
          description: "Apprendre les bases de Python et maîtriser les librairies essentielles de la data science : Pandas, NumPy, Matplotlib et Scikit-learn."
          resources:
            - text: "Python 3 Programming Specialization (Coursera)"
              url: "https://www.coursera.org/specializations/python-3-programming"
            - text: "10 minutes to pandas"
              url: "https://pandas.pydata.org/docs/user_guide/10min.html"
    
    - title: "🚀 Phase 2: Le cœur du métier (3-6 mois)"
      duration: "3-6 mois"
      steps:
        - title: "SQL et Bases de Données"
          description: "Le SQL est indispensable pour extraire des données. Comprendre les bases de données relationnelles est un prérequis."
          resources:
            - text: "SQLBolt (tutoriel interactif)"
              url: "https://sqlbolt.com/"
        
        - title: "Business Intelligence & Data Visualisation"
          description: "Apprendre à utiliser un outil de BI comme Tableau ou Power BI pour créer des tableaux de bord percutants."
          resources:
            - text: "Formations gratuites sur Tableau"
              url: "https://www.tableau.com/learn/training"
            - text: "Parcours d'apprentissage Power BI"
              url: "https://docs.microsoft.com/fr-fr/power-bi/learning-paths/"
        
        - title: "Machine Learning"
          description: "Comprendre les principaux algorithmes, comment les entraîner et, surtout, comment évaluer leur performance de manière critique."
          resources:
            - text: "Machine Learning Specialization par Andrew Ng (Coursera)"
              url: "https://www.coursera.org/specializations/machine-learning-introduction"

projects:
  title: "Projets pratiques"
  items:
    - title: "Projet 1: Analyser vos propres données"
      difficulty: "Débutant"
      duration: "8-10 heures"
      objective: "Appliquer tout le cycle d'analyse sur un sujet que vous connaissez bien."
      description: |
        <p>Exportez vos données depuis un service que vous utilisez (Spotify, Netflix, votre banque...). Utilisez Python/Pandas pour les nettoyer et les analyser.</p>
        <p>Posez-vous des questions (Quelle est ma chanson la plus écoutée chaque mois ?). Créez des visualisations pour y répondre. Ce projet personnel vous permettra de comprendre concrètement toute la chaîne d'analyse de données.</p>
      technologies:
        - "Python avec pandas, matplotlib, seaborn"
        - "Jupyter Notebook pour l'analyse interactive"
        - "APIs de services (Spotify, etc.)"
      resources:
        - text: "Spotify Web API Guide"
          url: "https://developer.spotify.com/documentation/web-api/"
        - text: "Pandas Tutorial complet"
          url: "https://pandas.pydata.org/docs/getting_started/intro_tutorials/"
        - text: "Seaborn Gallery"
          url: "https://seaborn.pydata.org/examples/index.html"
    
    - title: "Projet 2: Participer à une compétition Kaggle"
      difficulty: "Intermédiaire"
      duration: "15-20 heures"
      objective: "Se confronter à un vrai problème de data science et apprendre des meilleurs."
      description: |
        <p>Choisissez une compétition pour débutants sur Kaggle (ex: Titanic, House Prices). Téléchargez les données, explorez-les, entraînez un premier modèle et soumettez vos prédictions.</p>
        <p>L'essentiel est d'analyser les \"notebooks\" partagés par les meilleurs pour comprendre leurs techniques. C'est une excellente façon d'apprendre des pratiques de data science de niveau professionnel.</p>
      technologies:
        - "Python avec scikit-learn, pandas"
        - "Jupyter Notebook"
        - "Techniques de feature engineering"
        - "Validation croisée et métriques d'évaluation"
      resources:
        - text: "Kaggle Competitions"
          url: "https://www.kaggle.com/competitions"
    
    - title: "Projet 3: Créer un tableau de bord interactif de A à Z"
      difficulty: "Intermédiaire"
      duration: "12-15 heures"
      objective: "Maîtriser un outil de BI et les bonnes pratiques de la data visualisation."
      description: |
        <p>Trouvez un jeu de données public qui vous intéresse (ex: données sur le COVID, sur les films...). Définissez 3 à 5 questions business.</p>
        <p>Utilisez Tableau Public ou Power BI Desktop pour créer un tableau de bord interactif qui répond à ces questions. Publiez-le en ligne pour le partager. Ce projet vous donnera une expérience complète de la BI.</p>
      technologies:
        - "Tableau Public ou Power BI Desktop"
        - "Préparation et nettoyage de données"
        - "Principes de data visualisation"
        - "Design de dashboards interactifs"
      resources:
        - text: "Tableau Learning Path"
          url: "https://www.tableau.com/learn/training"
        - text: "Power BI Learning Path"
          url: "https://docs.microsoft.com/en-us/learn/powerplatform/power-bi"
        - text: "Data Visualization Principles"
          url: "https://www.storytellingwithdata.com/fundamentals"

