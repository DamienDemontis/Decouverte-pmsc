career_paths:
  title: "Perspectives de carrière"
  description: "Cette double compétence ouvre la voie à des carrières dynamiques à l'intersection de la technologie et du business."
  
  roles:
    - title: "Chef de Projet / Project Manager"
      icon: "fas fa-user-tie"
      mission: "Planifier, exécuter et finaliser les projets en respectant les contraintes de coût, de délai et de qualité."
      skills: "Organisation, communication, gestion des risques, maîtrise des méthodologies"
      salary: "38-45K€"
      country: "France"
    
    - title: "Product Manager / Product Owner"
      icon: "fas fa-lightbulb"
      mission: "Définir la vision et la stratégie d'un produit, et maximiser sa valeur pour les utilisateurs et l'entreprise."
      skills: "Vision stratégique, empathie client, priorisation, analyse de données"
      salary: "42-55K€"
      country: "France"
    
    - title: "Scrum Master"
      icon: "fas fa-sync-alt"
      mission: "Faciliter l'application du framework Scrum. Aider l'équipe à être plus efficace et à s'améliorer en continu."
