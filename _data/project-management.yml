  evolution:
    title: "Évolution de carrière"
    timeline:
      - category: "Début de carrière"
        side: "left"
        items:
          - title: "Chef de projet junior"
            description: "Gestion de projets à périmètre restreint avec accompagnement"
          - title: "Product Owner / Associate Product Manager"
            description: "Support à la gestion produit et interface avec les équipes techniques"
          - title: "Bras droit d'entrepreneur"
            description: "Assistance opérationnelle dans une startup"
          - title: "Consultant junior"
            description: "Accompagnement de projets de transformation"
      
      - category: "Milieu de carrière"
        side: "right"
        items:
          - title: "Chef de projet senior"
            description: "Pilotage de projets complexes et encadrement d'équipes"
          - title: "Product Manager / Lead Product Manager"
            description: "Propriété complète de la stratégie produit"
          - title: "Scrum Master / Coach Agile"
            description: "Facilitation de la transformation agile"
          - title: "Lancement de sa propre startup"
            description: "Entrepreneuriat et création d'entreprise"
      
      - category: "Carrière senior"
        side: "left"
        items:
          - title: "Directeur de projet / Responsable de pôle (PMO)"
            description: "Direction d'un portefeuille de projets"
          - title: "Head of Product / Chief Product Officer (CPO)"
            description: "Direction de la stratégie produit de l'entreprise"
          - title: "Entrepreneur en série / Business Angel"
            description: "Création et investissement dans des startups"
          - title: "Directeur de la transformation"
            description: "Pilotage de la transformation digitale de l'entreprise"

  skills:
    title: "Compétences recherchées"
    technical:
      title: "Compétences dures (Hard skills)"
      items:
        - "Maîtrise des méthodologies - Agile (Scrum, Kanban), Waterfall, Hybride"
        - "Outils - Jira, Asana, Trello, Notion, Miro"
        - "Gestion financière - Budgétisation, suivi des coûts, calcul du ROI"
        - "Analyse de données - KPIs, métriques produit (AARRR), SQL basique"
        - "Product Roadmapping - Création de feuilles de route produit"
    
    specialized:
      title: "Compétences stratégiques et entrepreneuriales"
      items:
        - "Vision stratégique - Aligner les projets avec les objectifs business et anticiper les évolutions du marché"
        - "Lean Startup - Maîtriser les principes de validation d'hypothèses, MVP et cycles build-measure-learn"
        - "Business Model Innovation - Comprendre et concevoir des modèles économiques disruptifs"
        - "Écosystème startup - Connaître le fonctionnement du financement (VC, BA) et l'accompagnement entrepreneurial"
        - "Design Thinking - Approche centrée utilisateur pour résoudre des problèmes complexes de manière créative"
    
    soft_skills:
      title: "Compétences humaines (Soft skills)"
      items:
        - "Leadership - Inspirer et motiver une équipe sans autorité hiérarchique"
        - "Communication - Clarté à l'écrit comme à l'oral, capacité à s'adresser à des interlocuteurs techniques et business"
        - "Négociation & Influence - Obtenir l'adhésion des parties prenantes"
        - "Résolution de problèmes - Analyser des situations complexes et trouver des solutions créatives"
        - "Adaptabilité - Naviguer dans l'incertitude et gérer le changement"

  market_trends:
    title: "Tendances du marché de l'emploi"
    items:
      - "Forte demande : Le PMI estime un besoin de 25 millions de nouveaux professionnels de la gestion de projet d'ici 2030"
      - "Valorisation des 'soft skills' : Les compétences humaines comme le leadership et la communication sont devenues aussi importantes que les compétences techniques"
      - "Hybridation des rôles : La frontière entre Product Manager, Project Manager et Business Analyst devient de plus en plus floue"
      - "Montée des outils IA : L'intelligence artificielle aide à automatiser la planification, le reporting et l'analyse des risques"
      - "Focus sur la valeur : Le succès n'est plus seulement mesuré par le respect du triptyque coût-délai-qualité, mais par la valeur apportée à l'entreprise et aux clients"

summary:
  title: "En résumé"
  description: "Le Strategic Project Management & Entrepreneurship combine l'excellence opérationnelle et la vision stratégique pour créer de la valeur dans l'écosystème technologique. Cette spécialité offre :"
  points:
    - title: "Polyvalence méthodologique"
      description: "Maîtrise des approches Agile, prédictives et hybrides selon les contextes"
    - title: "Vision entrepreneuriale"
      description: "Capacité à identifier les opportunités et transformer les idées en réalité"
    - title: "Leadership adaptatif"
      description: "Compétences pour diriger des équipes diverses dans des environnements changeants"
    - title: "Orientation résultats"
      description: "Focus sur la création de valeur mesurable pour l'entreprise et les clients"
    - title: "Agilité stratégique"
      description: "Capacité à adapter rapidement les stratégies selon les évolutions du marché"
  conclusion: "Cette spécialité MSc te prépare à devenir un leader capable de transformer des défis complexes en succès concrets, que ce soit en pilotant des projets d'envergure ou en créant des entreprises innovantes qui façonnent l'avenir."

