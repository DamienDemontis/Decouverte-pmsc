      duration: "1-3 mois"
      steps:
        - title: "Gestion de Projet Classique"
          description: "Comprendre les bases du cycle de vie d'un projet, le triangle d'or (coût, délai, périmètre) et les processus clés."
          resources:
            - text: "Guide PMBOK® du PMI"
              url: "https://ibimone.com/PMBOK%207th%20Edition%20%28iBIMOne.com%29.pdf).pdf"
            - text: "Google Project Management Certificate (Coursera)"
              url: "https://www.coursera.org/google-certificates/project-management-certificate"
        
        - title: "Principes de l'Agilité"
          description: "S'imprégner du Manifeste Agile et maîtriser les frameworks Scrum et Kanban."
          resources:
            - text: "Le Manifeste Agile"
              url: "https://agilemanifesto.org/"
            - text: "Le Guide Scrum"
              url: "https://www.scrum.org/resources/scrum-guide"
            - text: "Guide Kanban par Atlassian"
              url: "https://www.atlassian.com/agile/kanban"
    
    - title: "🚀 Phase 2: Stratégie & Produit (3-6 mois)"
      duration: "3-6 mois"
      steps:
        - title: "Lean Startup & Business Modeling"
          description: "Apprendre à construire des produits que les clients veulent vraiment, en minimisant le gaspillage."
          resources:
            - text: "'The Lean Startup' par Eric Ries"
              url: "https://www.theleanstartup.com"
            - text: "Business Model & Value Proposition Canvas"
              url: "https://www.strategyzer.com/canvas"
            - text: "'The Four Steps to the Epiphany' par Steve Blank"
              url: "https://steveblank.com/books-for-startups/"
        
        - title: "Gestion de Produit (Product Management)"
          description: "Apprendre à définir une vision produit, à gérer un backlog et à prioriser les fonctionnalités."
          resources:
            - text: "'Inspired' par Marty Cagan"
              url: "https://www.amazon.fr/Inspired-Create-Tech-Products-Customers/dp/1119387507"
            - text: "Mind the Product"
              url: "https://www.mindtheproduct.com/"

projects:
  title: "Projets pratiques"
  items:
    - title: "Projet 1: Gérer un projet personnel avec un outil Kanban"
      difficulty: "Débutant"
      duration: "2-4 heures (mise en place) + suivi continu"
      objective: "Appliquer les principes Kanban pour visualiser et gérer un flux de travail."
      description: |
        <p>Choisissez un projet personnel (ex: organiser un voyage, réviser pour un examen). Utilisez Trello, Asana ou Notion pour créer un tableau Kanban simple avec les colonnes "À faire", "En cours", "Terminé".</p>
        <p>Étapes :</p>
        <ol>
          <li>Choisir un outil (Trello est excellent pour commencer).</li>
          <li>Créer un tableau et les colonnes de base.</li>
          <li>Lister toutes les tâches ("cartes") dans la colonne "À faire".</li>
          <li>Déplacer les tâches au fur et à mesure de leur avancement.</li>
          <li>(Optionnel) Limiter le nombre de tâches dans "En cours" pour se concentrer.</li>
        </ol>
      technologies:
        - "Trello, Asana ou Notion"
        - "Méthode Kanban"
        - "Gestion de flux de travail"
      resources:
        - text: "Trello"
          url: "https://trello.com/"
        - text: "Asana"
          url: "https://asana.com/"
    
    - title: "Projet 2: Créer un Business Model Canvas pour une fausse startup"
      difficulty: "Débutant"
      duration: "3-5 heures"
      objective: "Formaliser une idée d'entreprise en utilisant un cadre structuré."
      description: |
        <p>Inventez une idée de startup (ex: un service de livraison par drone pour les cafés, une application qui traduit les miaulements de chat). Remplissez les 9 blocs du Business Model Canvas pour cette idée.</p>
        <p>Étapes :</p>
        <ol>
          <li>Télécharger un template du Business Model Canvas.</li>
          <li>Brainstormer pour remplir chaque bloc : Segments de clientèle, Proposition de valeur, Canaux, etc.</li>
          <li>Identifier les hypothèses les plus risquées de votre modèle.</li>
          <li>Réfléchir à comment vous pourriez tester ces hypothèses.</li>
        </ol>
      technologies:
        - "Business Model Canvas"
        - "Outils de brainstorming"
        - "Analyse de business model"
      resources:
        - text: "Template et explications du Business Model Canvas"
          url: "https://www.strategyzer.com/canvas"
        - text: "Miro (outil collaboratif avec template)"
          url: "https://miro.com/templates/business-model-canvas/"
    
    - title: "Projet 3: Lancer un MVP avec une solution No-Code"
      difficulty: "Intermédiaire"
      duration: "10-20 heures"
      objective: "Construire et lancer un produit fonctionnel sans écrire une ligne de code."
      description: |
        <p>Utilisez un outil comme Bubble, Glide ou Softr pour construire une version simple de votre idée de startup. L'objectif est de créer un produit que de vrais utilisateurs peuvent tester.</p>
        <p>Étapes :</p>
        <ol>
          <li>Choisir une idée simple (ex: un annuaire, une marketplace simple).</li>
          <li>Choisir l'outil No-Code le plus adapté.</li>
          <li>Suivre les tutoriels pour apprendre les bases de l'outil.</li>
          <li>Construire les fonctionnalités essentielles (MVP).</li>
          <li>Partager le lien avec des amis ou sur des forums pour obtenir des retours.</li>
        </ol>
      technologies:
        - "Bubble, Glide ou Softr"
        - "Développement No-Code"
        - "MVP (Minimum Viable Product)"
      resources:
        - text: "Bubble (pour les web apps complexes)"
          url: "https://bubble.io/"
        - text: "Glide (pour créer des apps depuis Google Sheets)"
          url: "https://www.glideapps.com/"
        - text: "Softr (pour créer des portails et marketplaces depuis Airtable)"
          url: "https://www.softr.io/"

