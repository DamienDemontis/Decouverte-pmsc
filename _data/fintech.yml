        description: "Les plateformes décentralisées sur lesquelles sont construites la plupart des applications de DeFi et de Web3."
      - category: "Communautés & Associations"
        examples: "France Fintech, Le Swave, Bpifrance"
        description: "Organisations qui animent l'écosystème, soutiennent les startups et font le lien avec les pouvoirs publics."

