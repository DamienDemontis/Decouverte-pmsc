careers: true
career_paths:
  title: "Perspectives de carrière"
  description: "La Fintech est l'un des secteurs les plus dynamiques en termes de recrutement, à la recherche de profils hybrides."
  
  roles:
    - title: "Product Manager Fintech"
      icon: "fas fa-lightbulb"
      mission: "Définir la stratégie et la feuille de route d'un produit financier, en faisant le pont entre les équipes techniques, design, et business."
      skills: "Vision produit, empathie client, compréhension réglementaire, analyse de données"
      salary: "45-60K€"
      country: "France, junior"
    
    - title: "Blockchain Developer"
      icon: "fab fa-ethereum"
      mission: "Concevoir, développer et déployer des smart contracts et des applications décentralisées (DApps)."
      skills: "Solidity, Rust, architectures décentralisées, cryptographie, sécurité"
      salary: "50-70K€"
      country: "France, junior"
    
    - title: "Quantitative Analyst (\"Quant\")"
      icon: "fas fa-calculator"
      mission: "Développer des modèles mathématiques et statistiques complexes pour les stratégies de trading, la gestion des risques et la tarification des produits dérivés."
      skills: "Mathématiques avancées, statistiques, Python/C++, machine learning"
      salary: "55-80K€"
      country: "France, junior"
    
    - title: "Financial Data Scientist"
      icon: "fas fa-search-dollar"
      mission: "Analyser de grands volumes de données financières pour en extraire des insights, construire des modèles de scoring, ou détecter des fraudes."
      skills: "Machine Learning, Big Data, Python (Pandas, Scikit-learn), SQL"
      salary: "45-60K€"
      country: "France, junior"
    
    - title: "RegTech / Compliance Officer"
      icon: "fas fa-gavel"
      mission: "S'assurer que les produits et opérations de l'entreprise sont conformes à la réglementation financière. Mettre en place des outils pour automatiser ce suivi."
      skills: "Droit financier, gestion des risques, connaissance des réglementations (KYC, AML)"
      salary: "40-55K€"
      country: "France, junior"

  evolution:
    title: "Évolution de carrière"
    timeline:
      - category: "Début de carrière (0-3 ans)"
        side: "left"
        items:
          - title: "Associate Product Manager"
            description: "Gestion de produits financiers sous supervision"
          - title: "Junior Data Scientist / Quant Analyst"
            description: "Analyse de données et modélisation financière"
          - title: "Software Engineer (Backend, avec focus finance)"
            description: "Développement de solutions fintech"
          - title: "Analyste KYC / AML"
            description: "Conformité réglementaire et lutte contre le blanchiment"
      
      - category: "Milieu de carrière (3-8 ans)"
        side: "right"
        items:
          - title: "Senior Product Manager / Lead PM"
            description: "Direction de la stratégie produit"
          - title: "Lead Data Scientist / Quant"
            description: "Leadership technique en analyse quantitative"
          - title: "Senior Blockchain Developer"
            description: "Architecture de solutions décentralisées"
          - title: "Compliance Manager"
            description: "Gestion de la conformité réglementaire"
      
      - category: "Carrière senior (+8 ans)"
        side: "left"
        items:
          - title: "Head of Product / CPO"
            description: "Direction de la stratégie produit globale"
          - title: "Head of Data Science / Chief Quant Officer"
            description: "Direction de l'équipe quantitative"
          - title: "Fondateur de sa propre Fintech"
            description: "Entrepreneuriat dans la fintech"
          - title: "Chief Compliance Officer"
            description: "Direction de la conformité réglementaire"

  skills:
    title: "Compétences recherchées"
    technical:
      title: "Compétences Techniques & Business"
      items:
        - "Analyse financière - Compréhension des marchés, modèles de revenus, gestion des risques"
        - "Réglementation - Connaissance des cadres comme DSP2, MiCA, et les processus KYC/AML"
        - "Technologies de paiement - Maîtrise des flux de paiement, des APIs (Stripe, etc.) et des solutions mobiles"
        - "Blockchain & DeFi - Compréhension de la tokenisation, des smart contracts et des protocoles de la finance décentralisée"
        - "Analyse de données - Compétences en SQL, Python et outils de BI pour le scoring, la détection de fraude et l'analyse de marché"
    
    soft_skills:
      title: "Soft skills et autres compétences"
      items:
        - "Vision Produit - Capacité à transformer un problème complexe en un produit financier simple et intuitif"
        - "Adaptabilité - Naviguer dans un environnement qui évolue très vite, tant technologiquement que réglementairement"
        - "Gestion de la complexité - Faire le pont entre des experts de domaines variés (finance, droit, tech)"
        - "Pensée critique - Analyser les nouveaux modèles économiques et évaluer leur viabilité et leurs risques"
        - "Communication - Savoir expliquer des concepts financiers et techniques à des audiences non-spécialistes"

  market_trends:
    title: "Tendances du marché"
    items:
      - "Hyper-personnalisation : Les services financiers deviennent de plus en plus personnalisés grâce à l'IA"
      - "Finance Intégrée (Embedded Finance) : La finance sort des banques pour s'intégrer dans toutes les applications (paiement, crédit, assurance)"
      - "Convergence Web2 et Web3 : Les acteurs traditionnels intègrent des technologies blockchain, tandis que les acteurs DeFi cherchent à simplifier l'accès"
      - "Focus sur la RegTech : L'automatisation de la conformité réglementaire est un secteur en pleine explosion"
      - "Finance Durable : Forte demande pour des solutions Fintech qui mesurent et favorisent l'investissement à impact (ESG)"

summary:
  title: "En résumé"
  description: "La Fintech & Stratégies Financières représentent l'intersection entre innovation technologique et services financiers, transformant la façon dont nous gérons, investissons et utilisons l'argent. Cette spécialité combine :"
  points:
    - title: "Innovation technologique"
      description: "Maîtrise des technologies émergentes (blockchain, IA, APIs) appliquées à la finance"
    - title: "Compréhension financière"
      description: "Connaissance approfondie des marchés, produits et réglementations financières"
    - title: "Vision produit"
      description: "Capacité à concevoir des services financiers centrés utilisateur"
    - title: "Conformité réglementaire"
      description: "Navigation dans l'environnement réglementaire complexe de la finance"
