careers: true
career_paths:
  title: "Perspectives de carrière"
  description: "L'Intelligence Artificielle offre des opportunités de carrière exceptionnelles et diversifiées, avec une demande qui ne cesse de croître dans tous les secteurs économiques."
  
  roles:
    - title: "Data Scientist / ML Engineer"
      icon: "fas fa-brain"
      mission: "Concevoir, entraîner et optimiser des modèles d'IA pour résoudre des problèmes complexes."
      skills: "Machine learning, statistiques, programmation (Python), algorithmique, data engineering"
      salary: "45-85K€"
      country: "France"
    
    - title: "AI Research Scientist"
      icon: "fas fa-microchip"
      mission: "Faire avancer l'état de l'art en IA en développant de nouvelles architectures et approches."
      skills: "Mathématiques avancées, deep learning, recherche, publications scientifiques"
      salary: "60-120K€"
      country: "France"
    
    - title: "AI Software Engineer"
      icon: "fas fa-laptop-code"
      mission: "Développer des systèmes et applications intégrant des capacités d'IA en production."
      skills: "Génie logiciel, MLOps, frameworks d'IA, cloud computing, architecture"
      salary: "50-95K€"
      country: "France"
    
    - title: "AI Product Manager"
      icon: "fas fa-project-diagram"
      mission: "Définir et piloter le développement de produits et services basés sur l'IA."
      skills: "Compréhension technique de l'IA, gestion de produit, UX, stratégie commerciale"
      salary: "55-90K€"
      country: "France"

  evolution:
    title: "Évolution de carrière"
    timeline:
      - category: "Début de carrière"
        side: "left"
        items:
          - title: "Junior Data Scientist"
            description: "Analyse de données et développement de modèles supervisés"
          - title: "ML Engineer"
            description: "Implémentation et déploiement de modèles d'apprentissage"
          - title: "AI Application Developer"
            description: "Intégration d'API d'IA dans des applications"
          - title: "Computer Vision Engineer"
            description: "Développement de systèmes d'analyse d'images et vidéos"
      
      - category: "Mi-carrière"
        side: "right"
        items:
          - title: "Senior Data Scientist"
            description: "Conception de solutions IA complexes et encadrement d'équipe"
          - title: "Lead AI Engineer"
            description: "Architecture et optimisation de systèmes d'IA en production"
          - title: "NLP Specialist"
            description: "Expertise en systèmes de traitement du langage naturel"
          - title: "AI Consultant"
            description: "Conseil en stratégie et implémentation d'IA pour les organisations"
      
      - category: "Senior"
        side: "left"
        items:
          - title: "Chief AI Officer"
            description: "Direction de la stratégie IA au niveau exécutif"
          - title: "AI Research Director"
            description: "Supervision des équipes de recherche en IA"
          - title: "AI Ethics Officer"
            description: "Gouvernance éthique des systèmes d'IA"
          - title: "AI Entrepreneur"
            description: "Création de startups spécialisées en IA"

  skills:
    title: "Compétences recherchées"
    technical:
      title: "Compétences techniques"
      items:
        - "Langages de programmation - Python, R, Julia, C++, JAX"
        - "Frameworks d'IA - TensorFlow, PyTorch, scikit-learn, Keras, Hugging Face"
        - "MLOps - Kubeflow, MLflow, DVC, Weights & Biases, SageMaker"
        - "Cloud - AWS (SageMaker), Google Cloud (Vertex AI), Azure ML"
        - "Big Data - Spark, Hadoop, Kafka, bases de données distribuées"
    
    specialized:
      title: "Domaines de spécialisation"
      items:
        - "Computer Vision - Reconnaissance d'images, détection d'objets, traitement vidéo"
        - "NLP - Traitement du langage, modèles génératifs, chatbots, traduction"
        - "Reinforcement Learning - Apprentissage par renforcement pour systèmes autonomes"
        - "Explainable AI - Interprétation et explication des modèles d'IA"
        - "Speech Processing - Reconnaissance et synthèse vocale"
    
    soft_skills:
      title: "Soft skills et autres compétences"
      items:
        - "Pensée critique - Capacité à évaluer et questionner les résultats des modèles"
        - "Communication - Expliquer des concepts complexes d'IA à des non-spécialistes"
        - "Éthique - Sensibilité aux enjeux éthiques et sociétaux de l'IA"
        - "Collaboration - Travail en équipe multidisciplinaire"
        - "Recherche - Veille technologique et auto-formation continue"

  market_trends:
    title: "Tendances du marché"
    items:
      - "+37% de croissance des offres d'emploi en IA et data science depuis 2021"
      - "5 fois plus de demande que d'offre pour les profils spécialisés en IA générative"
      - "+56% de salaire moyen par rapport aux autres métiers tech pour les spécialistes IA expérimentés"
      - "93% des entreprises du CAC40 déclarent investir ou prévoir d'investir dans l'IA d'ici 2025"
      - "Démocratisation des outils \"no-code/low-code\" d'IA créant de nouveaux rôles hybrides"

summary:
  title: "En résumé"
  description: "L'Intelligence Artificielle représente l'une des révolutions technologiques les plus profondes de notre époque, transformant radicalement industries et sociétés. Cette spécialité combine :"
  points:
    - title: "Diversité technique"
      description: "Du machine learning classique aux systèmes génératifs, en passant par la vision et le NLP"
    - title: "Impact concret"
      description: "Applications révolutionnaires dans la santé, les transports, la finance et bien d'autres secteurs"
    - title: "Évolution rapide"
      description: "Un domaine en constante mutation avec des avancées majeures chaque année"
    - title: "Demande croissante"
      description: "Des opportunités professionnelles nombreuses et variées"
    - title: "Dimension éthique"
      description: "Des questions fondamentales sur l'impact sociétal de ces technologies"
  conclusion: "Cette spécialité MSc offre un équilibre parfait entre théorie et pratique, te préparant à devenir un acteur de cette transformation technologique majeure tout en développant une vision critique et responsable."

