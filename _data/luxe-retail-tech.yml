      skills: "SQL, outils de BI (Tableau/Power BI), connaissance des KPIs du retail"
      salary: "40-48K€"
      country: "France"
    
    - title: "CRM & Personalization Manager"
      icon: "fas fa-user-tag"
      mission: "Gérer la plateforme CRM et développer des campagnes marketing personnalisées pour augmenter l'engagement et la fidélité des clients."
