careers: true
career_paths:
  title: "Perspectives de carrière"
  description: "Des carrières passionnantes à la croisée de la créativité, du business et de la technologie de pointe."
  
  roles:
    - title: "Chef de Projet E-commerce / Omnicanal"
      icon: "fas fa-mobile-alt"
      mission: "Piloter les projets digitaux (refonte de site, lancement d'app, projet omnicanal) en coordonnant les équipes techniques, marketing et commerciales."
      skills: "Gestion de projet, compréhension des enjeux e-commerce et retail, communication"
      salary: "40-50K€"
      country: "France"
    
    - title: "Client Experience Manager"
      icon: "fas fa-heart"
      mission: "Cartographier et optimiser le parcours client sur tous les points de contact pour garantir une expérience fluide, cohérente et exceptionnelle."
      skills: "Design thinking, empathie client, analyse de données, gestion de projet"
      salary: "40-50K€"
      country: "France"
    
    - title: "Retail Innovation Manager"
      icon: "fas fa-lightbulb"
      mission: "Assurer une veille sur les nouvelles technologies et les startups, et piloter des projets pilotes pour tester de nouvelles expériences en magasin ou en ligne."
      skills: "Curiosité, connaissance de l'écosystème tech, gestion de projet, capacité à convaincre"
      salary: "42-55K€"
      country: "France"
    
    - title: "Retail / E-commerce Data Analyst"
      icon: "fas fa-chart-line"
