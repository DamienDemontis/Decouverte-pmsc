career_paths:
  title: "Perspectives de carrière"
  description: "La cybersécurité offre des opportunités de carrière diverses, stimulantes et bien rémunérées dans un marché en forte demande."
  
  roles:
    - title: "Pentester / Red Team"
      icon: "fas fa-user-secret"
      mission: "Tester la sécurité des systèmes en simulant des attaques réelles pour identifier les vulnérabilités."
      skills: "Hacking éthique, OSINT, social engineering, sécurité web et réseau"
      salary: "45-80K€"
